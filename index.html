<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grant Delgado</title>
  <meta name="description" content="Grant Delgado">
  <meta property="og:title" content="Grant Delgado">
  <meta property="og:url" content="https://grantdelgado.com">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111'/><text x='50' y='66' font-family='Helvetica,Arial,sans-serif' font-size='44' font-weight='700' fill='%23f5f5f5' text-anchor='middle'>GD</text></svg>">
  <style>
    :root {
      --bg: #0e0e10;
      --fg: #f5f5f4;
      --muted: #8a8a8e;
      --accent: #e8e8e6;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #fafaf9; --fg: #18181b; --muted: #71717a; --accent: #27272a; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    main {
      text-align: center;
      padding: 2rem;
      animation: fade 1.2s ease-out both;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .rule {
      width: 48px;
      height: 2px;
      background: var(--muted);
      margin: 1.75rem auto;
      opacity: 0.5;
    }
    p {
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }
    a:hover, a:focus-visible { border-bottom-color: var(--accent); }
    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Grant Delgado</h1>
    <div class="rule" aria-hidden="true"></div>
    <p><a href="mailto:me@grantdelgado.com">me@grantdelgado.com</a></p>
  </main>
</body>
</html>
